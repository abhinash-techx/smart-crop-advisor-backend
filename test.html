<!-- Crop Recommendation Section -->
<section class="max-w-7xl mx-auto p-6 mt-10 grid grid-cols-1 md:grid-cols-2 gap-10 bg-white rounded-lg shadow-md">
  <!-- Left: Text & Form -->
  <div class="flex flex-col justify-center space-y-6">
    <h2 class="text-3xl font-bold leading-tight">Crop Recommendations</h2>
    <p class="text-gray-700 max-w-md">
      Enter your soil type, location, and weather to get AI-based crop suggestions.
    </p>

    <!-- Input Form -->
    <form class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- Soil Type -->
      <div class="flex flex-col">
        <label for="soil" class="mb-2 font-medium">Soil Type:</label>
        <select id="soil" class="border border-gray-300 rounded-md p-2">
          <option value="">Select Soil</option>
          <option value="sandy">Sandy</option>
          <option value="clay">Clay</option>
          <option value="loamy">Loamy</option>
          <option value="peaty">Peaty</option>
          <option value="chalky">Chalky</option>
        </select>
      </div>

      <!-- Location -->
      <div class="flex flex-col">
        <label for="location" class="mb-2 font-medium">Location:</label>
        <input type="text" id="location" placeholder="Enter your city" class="border border-gray-300 rounded-md p-2">
      </div>

      <!-- Weather -->
      <div class="flex flex-col">
        <label for="weather" class="mb-2 font-medium">Weather:</label>
        <select id="weather" class="border border-gray-300 rounded-md p-2">
          <option value="">Select Weather</option>
          <option value="sunny">Sunny</option>
          <option value="rainy">Rainy</option>
          <option value="humid">Humid</option>
          <option value="dry">Dry</option>
        </select>
      </div>
    </form>

    <!-- Submit Button -->
    <div>
      <button class="w-max bg-green-700 hover:bg-green-800 text-white font-semibold py-3 px-6 rounded-md">
        Get Recommendations
      </button>
    </div>
  </div>

  <!-- Right: Illustration -->
  <div class="flex justify-center md:justify-end items-center">
    <img src="https://storage.googleapis.com/workspace-0f70711f-8b4e-4d94-86f1-2a93ccde5887/image/e56756e1-26fb-4231-9586-02d1b60866fd.png"
      alt="Farmer Image"
      class="max-w-full rounded-lg shadow-lg">
  </div>
</section>
